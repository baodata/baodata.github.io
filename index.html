<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lữ bảo đạt</title>
  <style>
    /* RGB color cycling animation */
    @keyframes rgbShift {
      0% { color: #ff0000; }
      17% { color: #ff8800; }
      33% { color: #ffff00; }
      50% { color: #00ff00; }
      67% { color: #00ffff; }
      83% { color: #0000ff; }
      100% { color: #ff0000; }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rgb-text {
      font-size: 3rem;
      animation: rgbShift 1.5s linear infinite;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="rgb-text">lữ bảo đạt</div>
</body>
</html>
